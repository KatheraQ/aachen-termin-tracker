<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}亚琛 Termin 提醒 / Aachen Termin Tracker{% endblock %}</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
           max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.55; color: #222; }
    h1 { font-size: 1.5rem; }
    h2 { font-size: 1.15rem; margin-top: 2rem; }
    label { display: block; margin: 0.5rem 0; }
    input[type="email"] { width: 100%; padding: 0.6rem; font-size: 1rem;
                          border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { padding: 0.7rem 1.4rem; font-size: 1rem; background: #d9534f;
             color: white; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #c9302c; }
    .checkbox-row { display: flex; align-items: flex-start; gap: 0.5rem; margin: 0.4rem 0; }
    .checkbox-row input { margin-top: 0.3rem; }
    footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid #eee;
             font-size: 0.85rem; color: #666; }
    footer a { color: #666; margin-right: 1rem; }
    .ok { color: #2e7d32; }
    .err { color: #c62828; }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
  <footer>
    <a href="/">首页 / Home</a>
    <a href="/impressum">Impressum</a>
    <a href="/datenschutz">Datenschutz</a>
  </footer>
</body>
</html>
